apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "los.fullname" . }}
  namespace: {{ .Values.los_namespace }}
  labels:
    {{- include "los.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "los.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: los
        {{- include "los.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.imageCredentials }}
      imagePullSecrets:
        - name: pull-secret
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.los.image.repository }}:{{ .Values.los.image.tag }}"
          imagePullPolicy: {{ .Values.los.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
          ports:
            - name: http
              containerPort: {{ .Values.los.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.los.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.los.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.los.resources | nindent 12 }}
      {{- with .Values.los.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.los.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.los.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
